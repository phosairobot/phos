site_name: PHOS
site_description: A physical companion for AI Agents, built on Raspberry Pi.
site_url: https://phosairobot.github.io/phos/

repo_url: https://github.com/phosairobot/phos
repo_name: phosairobot/phos
edit_uri: edit/main/

site_dir: build-site
docs_dir: docs

exclude_docs: |
  assets/ASSETS.md

theme:
  name: material
  language: en

  logo: assets/images/phos.png
  favicon: assets/images/phos.png

  palette:
    scheme: slate
    primary: blue
    accent: cyan

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

hooks:
  - docs/hooks/version.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phosairobot/phos
      name: PHOS on GitHub

    - icon: fontawesome/brands/x-twitter
      link: https://x.com/phosairobot
      name: PHOS on X

    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/phosairobot/
      name: PHOS on Instagram

    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@phosairobot
      name: PHOS on YouTube

extra_css:
  - assets/css/phos.css

nav:
  - Home: index.md

  - Discover PHOS:
      - Overview: discover.md
      - What PHOS can do: features.md
      - How PHOS works: how-phos-works.md
      - Visual personality: vision-expressions.md
      - Environmental awareness: environmental-awareness.md
      - Motion awareness: motion-awareness.md
      - MCP & AI Agent Integration: mcp-overview.md
      - Use cases: use-cases.md
      - Getting started: installation-overview.md

  - Technical Documentation:
      - Installation & setup: installation.md
      - Configuration & migration: development.md
      - Architecture: architecture.md
      - Hardware & sensors: hardware-overview.md
      - Hardware reference: hardware.md
      - External controller / ESP32: hardware-controller.md
      - Display & expressions: visual-system.md
      - Vision & presence: vision.md
      - Vision model evaluation: vision-model-evaluation.md
      - Voice & speech: voice.md
      - Voice commands: voice-commands.md
      - Text to speech: tts.md
      - MCP:
          - MCP Reference: mcp.md
          - Agent-connected model: ai.md
      - REST API: remote-api.md
      - Web Administration: web-administration.md
      - Web Admin overview: web-admin-overview.md
      - Appearance skins: appearance/creating-skins.md
      - API contract notes: api.md
      - Development & testing: documentation.md
      - Configuration migration: configuration-migration.md
      - Architecture decisions: decisions.md
      - Current implementation state: current-state.md

  - Roadmap: roadmap.md

  - Releases:
      - Releases overview: releases.md
      - PHOS 1.8.0: release-1.8.0.md
      - PHOS 1.7.0: release-1.7.0.md
      - PHOS 1.4.0: release-1.4.0.md
      - PHOS 1.3.0: release-1.3.0.md
      - PHOS 1.2.0: release-1.2.0.md
      - PHOS 1.1.0: release-1.1.0.md
      - PHOS 1.0.0: release-1.0.0.md
