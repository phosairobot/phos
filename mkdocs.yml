site_name: PHOS
site_description: Open-source physical perception and expressive feedback for AI Agents, built on Raspberry Pi.
site_url: https://phosairobot.github.io/phos/

repo_url: https://github.com/phosairobot/phos
repo_name: phosairobot/phos
edit_uri: edit/main/

site_dir: build-site
docs_dir: docs

exclude_docs: |
  assets/ASSETS.md

theme:
  name: material
  language: en

  logo: assets/images/phos.png
  favicon: assets/images/phos.png

  palette:
    scheme: slate
    primary: blue
    accent: cyan

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

hooks:
  - docs/hooks/version.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  homepage: https://phosairobot.github.io/phos/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phosairobot/phos
      name: PHOS on GitHub

    - icon: fontawesome/brands/x-twitter
      link: https://x.com/phosairobot
      name: PHOS on X

    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/phosairobot/
      name: PHOS on Instagram

    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@phosairobot
      name: PHOS on YouTube

extra_css:
  - assets/css/phos.css

nav:
  - Home: index.md

  - User & Maker Guide:
      - Start here:
          - Discover PHOS: discover.md
          - Core capabilities: features.md
          - How PHOS works: how-phos-works.md
          - Use cases: use-cases.md
      - Build & install:
          - Build overview: build-phos.md
          - Hardware requirements: hardware-overview.md
          - Installation overview: installation-overview.md
          - Installation & setup: installation.md
          - Sensors, ESP32 & wiring: hardware.md
      - Connect & configure:
          - MCP agent integration: mcp-overview.md
          - Connect your first MCP client: developer-quickstart.md
          - REST API: remote-api.md
          - Web Admin overview: web-admin-overview.md
          - Web Admin manual: web-administration.md
      - Perception & interaction:
          - Expressive behaviors: vision-expressions.md
          - Environmental sensors: environmental-awareness.md
          - Motion sensors: motion-awareness.md
          - Voice (TTS & STT): voice.md
          - Voice commands: voice-commands.md

  - Developer & Architecture:
      - Architecture & runtime:
          - Architecture overview: architecture.md
          - Accepted decisions: decisions.md
          - Implementation state: current-state.md
          - Development, configuration & testing: development.md
          - Configuration migration: configuration-migration.md
          - AI provider strategy: ai.md
      - Protocols & subsystem references:
          - MCP protocol reference: mcp.md
          - API contract notes: api.md
          - ESP32 controller protocol: hardware-controller.md
          - Display & expressions: visual-system.md
          - Vision pipeline: vision.md
          - Vision model evaluation: vision-model-evaluation.md
          - TTS providers & playback: tts.md
      - Extend & contribute:
          - Create appearance skins: appearance/creating-skins.md
          - Contributing & project status: contributing.md
          - Documentation guide: documentation.md
          - Website audit: website-audit.md
          - License audit: LICENSE_AUDIT.md

  - Roadmap: roadmap.md

  - Releases:
      - Releases overview: releases.md
      - PHOS 1.9.0: release-1.9.0.md
      - PHOS 1.8.0: release-1.8.0.md
      - PHOS 1.7.0: release-1.7.0.md
      - PHOS 1.4.0: release-1.4.0.md
      - PHOS 1.3.0: release-1.3.0.md
      - PHOS 1.2.0: release-1.2.0.md
      - PHOS 1.1.0: release-1.1.0.md
      - PHOS 1.0.0: release-1.0.0.md
