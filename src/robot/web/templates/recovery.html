{% extends 'base.html' %}{% block content %}<section class="account"><h2>Password recovery</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="request"><button>Request recovery code</button></form><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="reset"><label>Recovery code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><label>New password<input name="new" type="password" minlength="12" maxlength="256" required></label><label>Confirm password<input name="confirmation" type="password" minlength="12" maxlength="256" required></label><button>Reset password</button></form></section>{% endblock %}
