[project]
name = "phos-robot"
dynamic = ["version"]
description = "Modular personal robot for Raspberry Pi"
requires-python = ">=3.9"

[project.optional-dependencies]
ccs811 = ["smbus2>=0.4,<1"]
imu = ["smbus2>=0.4,<1"]
led-ring = ["rpi-ws281x>=5.0,<6"]
environmental = ["RPi.bme280>=0.2.4,<0.3", "bmp280>=1.0.0,<2", "smbus2>=0.4,<1"]
bmp280 = ["bmp280>=1.0.0,<2", "smbus2>=0.4,<1"]
bme280 = ["RPi.bme280>=0.2.4,<0.3", "smbus2>=0.4,<1"]
web = ["Flask>=3.1,<4", "Flask-WTF>=1.2,<2", "Werkzeug>=3.1,<4", "waitress>=3.0.2,<4"]
aws = ["boto3>=1.34"]
vision = [
    "opencv-python-headless>=4.8",
    "picamera2>=0.3",
]
all = [
    "phos-robot[ccs811,imu,led-ring,environmental,web,aws,vision]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"robot.assets" = ["images/*.png", "audio/*.wav"]
"robot.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/swagger-ui/*"]

[tool.setuptools.dynamic]
version = {attr = "robot.__version__"}

[tool.setuptools.data-files]
"share/phos/config" = ["config/phos.json"]
