[project]
name = "phos-robot"
dynamic = ["version"]
description = "Modular personal robot for Raspberry Pi"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7", "cryptography>=42,<45"]

[project.optional-dependencies]
ccs811 = ["smbus2>=0.4,<1"]
imu = ["smbus2>=0.4,<1"]
led-ring = ["rpi-ws281x>=5.0,<6"]
environmental = ["RPi.bme280>=0.2.4,<0.3", "bmp280>=1.0.0,<2", "smbus2>=0.4,<1"]
bmp280 = ["bmp280>=1.0.0,<2", "smbus2>=0.4,<1"]
bme280 = ["RPi.bme280>=0.2.4,<0.3", "smbus2>=0.4,<1"]
web = ["Flask>=3.1,<4", "Flask-WTF>=1.2,<2", "Werkzeug>=3.1,<4", "waitress>=3.0.2,<4"]
aws = ["boto3>=1.34"]
vision = [
    # Raspberry Pi OS supplies the sole cv2 provider (python3-opencv) so it
    # remains compatible with Picamera2 in the system-site-packages venv.
    "picamera2>=0.3",
]
voice = ["audioop-lts>=0.2.2,<0.3; python_version >= '3.13'", "elevenlabs>=2,<3", "piper-tts>=1.3,<2", "vosk>=0.3.44,<0.4"]
all = [
    "phos-robot[ccs811,imu,led-ring,environmental,web,aws,vision,voice]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"robot.assets" = ["images/*.png", "audio/*.wav"]
"robot.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/swagger-ui/*"]

[tool.setuptools.dynamic]
version = {attr = "robot.__version__"}

[tool.setuptools.data-files]
"share/phos/config" = ["config/phos.yaml", "config/phos.json"]
